services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.7}
    ports:
      - "8000:8000"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "8501:8501"
